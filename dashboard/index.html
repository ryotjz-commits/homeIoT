<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novia Home V2 - 4 Channel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <header class="header">
      <div class="logo">🏠</div>
      <div>
        <h1>Novia Home</h1>
        <p>Control Lampu + Kipas • 4 Channel</p>
      </div>
      <div class="status-dot" id="connStatus" title="Status Koneksi">●</div>
    </header>

    <!-- SETTING IP ESP32 -->
    <section class="card ip-card">
      <div class="ip-row">
        <div>
          <label>IP ESP32</label>
          <p class="hint" id="ipHint">Contoh: 192.168.1.105</p>
        </div>
        <button class="btn-small" onclick="changeIP()">Ubah IP</button>
      </div>
      <div class="ip-input-row">
        <input type="text" id="espIP" placeholder="192.168.1.105" />
        <button class="btn-primary" onclick="saveIP()">Simpan</button>
      </div>
      <div class="meta-row">
        <span id="espTime">Jam ESP32: --:--</span>
        <span id="lastUpdate">Update: -</span>
      </div>
    </section>

    <!-- TOMBOL CEPAT -->
    <section class="quick-actions">
      <button class="btn-danger" onclick="allOff()">⏻ Matikan Semua</button>
      <button class="btn-secondary" onclick="refreshStatus()">🔄 Refresh</button>
    </section>

    <!-- 4 KARTU AKAN DI-RENDER LEWAT app.js -->
    <main id="cardsContainer" class="cards">
      <p class="loading">Memuat status dari ESP32...</p>
    </main>

    <footer>
      <p>Novia Home V2 • Blynk V0-V3 • Scheduler WIB • NTP</p>
      <p class="small">Pastikan HP & ESP32 di WiFi yang sama.</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
