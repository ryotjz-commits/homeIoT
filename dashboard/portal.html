
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Novia Home Setup</title>

<style>

body {
 background:#171918;
 color:#eee9dc;
 font-family:Arial,sans-serif;
 padding:20px;
}

main {
 max-width:380px;
 margin:40px auto;
 background:#242824;
 padding:22px;
 border-radius:15px;
}

h2 {color:#c6a66b}

input,select,button {
 width:100%;
 padding:13px;
 margin:9px 0;
 box-sizing:border-box;
 border-radius:8px;
 border:1px solid #444;
}

input,select {
 background:#171918;
 color:white;
}

button {
 background:#c6a66b;
 color:#171918;
 border:0;
 font-weight:bold;
}

small {color:#aaa}

</style>
</head>

<body>

<main>

<h2>NOVIA HOME</h2>

<p>WiFi Configuration</p>

<form action="/save" method="POST">

<select name="ssid" id="ssid" required>
<option value="">Pilih jaringan WiFi</option>
</select>

<input
 name="password"
 type="password"
 placeholder="Password WiFi"
 maxlength="63">

<button type="submit">
 SIMPAN KONFIGURASI
</button>

</form>

<button onclick="scan()">
 SCAN WIFI
</button>

<small id="info">
 Novia Home Setup
</small>

</main>

<script>

async function scan() {

 const info =
 document.getElementById("info");

 info.textContent =
 "Memindai jaringan...";

 try {

  const r = await fetch("/scan");

  const data = await r.json();

  const select =
   document.getElementById("ssid");

  select.innerHTML =
   '<option value="">Pilih jaringan WiFi</option>';

  data.forEach(x => {

   const option =
    document.createElement("option");

   option.value = x.ssid;

   option.textContent =
    x.ssid + " (" + x.rssi + " dBm)";

   select.appendChild(option);

  });

  info.textContent =
   data.length + " jaringan ditemukan";

 } catch(e) {

  info.textContent =
   "Gagal memindai jaringan";

 }

}

scan();

</script>

</body>
</html>
